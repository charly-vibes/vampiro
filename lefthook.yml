# lefthook.yml - pre-commit/pre-push hooks
#
# Install: lefthook install
# Bypass (WIP only): git push --no-verify
#
# Warning: --no-verify requires:
#   - Commit message MUST contain "WIP" or "wip"
#   - Tests MUST be fixed before merging

pre-commit:
  parallel: true
  commands:
    format-check:
      glob: "*.rs"
      run: just fmt-check
    lint:
      glob: "*.rs"
      run: just lint
    trailing-whitespace:
      run: git diff --check --cached
      exclude: 'Cargo.lock|*.patch'
    end-of-file-fixer:
      run: |
        git diff --cached --name-only -z | xargs -0 -I{} sh -c 'test "$(tail -c1 "{}")" = "" || (echo "{}: missing trailing newline"; exit 1)'
      exclude: 'Cargo.lock|*.png|*.ico|*.jpg|*.gif|*.pdf|*.woff2'
    check-added-large-files:
      run: |
        git diff --cached --name-only -z | xargs -0 -I{} sh -c '
          size=$(wc -c < "{}" 2>/dev/null || echo 0)
          if [ "$size" -gt 5242880 ]; then
            echo "{}: over 5MB"; exit 1
          fi
        '

pre-push:
  parallel: true
  commands:
    lint:
      run: just lint
    fmt:
      run: just fmt-check
    test:
      run: cargo test
      fail_text: |
        Tests failed. Push blocked.

        To bypass (WIP only): git push --no-verify

        Warning: --no-verify requires justification:
        - Commit message MUST contain "WIP" or "wip"
        - You MUST fix tests before merging