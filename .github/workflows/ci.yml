# CI workflow - runs the same commands as local development
#
# Uses `just ci` to ensure parity between local and CI environments.
# If CI fails, run `just ci` locally to reproduce the issue.
# (Standardized per dulce-de-leche docs/standardization.md §1; the old
# planning/rust/docs jobs were folded into the `ci` recipe + docs.yml.)

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install dont (epistemic gate)
        run: cargo install --locked dont-cli@0.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenSpec
        run: npm install --global @fission-ai/openspec@0.19.0

      - name: Install ecosystem tools (§4 dogfood matrix, pinned)
        run: |
          cargo install --locked pretender@0.6.0 wai-cli@2026.9.28 dulce-de-leche@0.7.0
      - name: Install bd (beads, pinned §4)
        run: |
          tmp=$(mktemp -d)
          curl -fsSL https://github.com/gastownhall/beads/releases/download/v1.3.0/beads_1.3.0_linux_amd64.tar.gz -o "$tmp/bd.tgz"
          # extract only the binary — the tarball also ships README/LICENSE/CHANGELOG
          # which must not clobber the repo checkout
          tar -xzf "$tmp/bd.tgz" -C "$tmp" bd
          sudo mv "$tmp/bd" /usr/local/bin/bd
      # §4 dogfood: installed tools must run, not just install
      - name: Smoke dogfooded tools
        env:
          DO_NOT_TRACK: "1"
        run: |
          bd --version >/dev/null
          ddl status >/dev/null
          wai status >/dev/null
          openspec validate --all >/dev/null
          pretender check >/dev/null
      # Run the exact same command as local development
      - name: Run CI pipeline
        env:
          DO_NOT_TRACK: "1"
        run: just ci
