# Release workflow — build cross-platform binaries and publish to crates.io + GitHub Releases
#
# Triggered by pushing a version tag (e.g., `git tag v0.3.0 && git push --tags`).
# - Builds the `vampiro` CLI for Linux, macOS, and Windows.
# - Publishes all workspace crates to crates.io in topological dependency order.
# - Creates a GitHub Release with pre-built binaries and checksums.
#
# Required secrets:
#   GITHUB_TOKEN           - automatically provided by GitHub Actions
#   CARGO_REGISTRY_TOKEN   - crates.io API token for publishing the crates
#
# Publish order (topological — each crate's path deps must land on crates.io first):
#   vampiro-cir → vampiro-law → vampiro-frontend-harness → vampiro-rust-frontend →
#   vampiro-seam-analysis → vampiro-python-frontend → vampiro-clojure-frontend →
#   vampiro-julia-frontend → vampiro-lifecycle-analysis → vampiro (the CLI)

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux

      - name: Install aarch64 cross-compile toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build x86_64 Linux
        run: cargo build --release --target x86_64-unknown-linux-gnu -p vampiro

      - name: Build aarch64 Linux
        run: cargo build --release --target aarch64-unknown-linux-gnu -p vampiro
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Stage binaries
        run: |
          mkdir -p bins/linux_amd64 bins/linux_arm64
          cp "target/x86_64-unknown-linux-gnu/release/vampiro" "bins/linux_amd64/vampiro"
          cp "target/aarch64-unknown-linux-gnu/release/vampiro" "bins/linux_arm64/vampiro"

      - uses: actions/upload-artifact@v4
        with:
          name: bins-linux
          path: bins/
          retention-days: 1

  build-darwin:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: darwin

      - name: Build x86_64 macOS
        run: cargo build --release --target x86_64-apple-darwin -p vampiro

      - name: Build aarch64 macOS
        run: cargo build --release --target aarch64-apple-darwin -p vampiro

      - name: Stage binaries
        run: |
          mkdir -p bins/darwin_amd64 bins/darwin_arm64
          cp "target/x86_64-apple-darwin/release/vampiro" "bins/darwin_amd64/vampiro"
          cp "target/aarch64-apple-darwin/release/vampiro" "bins/darwin_arm64/vampiro"

      - uses: actions/upload-artifact@v4
        with:
          name: bins-darwin
          path: bins/
          retention-days: 1

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: Build x86_64 Windows
        run: cargo build --release --target x86_64-pc-windows-msvc -p vampiro

      - name: Stage binaries
        shell: bash
        run: |
          mkdir -p bins/windows_amd64
          cp "target/x86_64-pc-windows-msvc/release/vampiro.exe" "bins/windows_amd64/vampiro.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: bins-windows
          path: bins/
          retention-days: 1

  publish:
    name: Publish to crates.io + GitHub Release
    needs: [build-linux, build-darwin, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: publish

      - uses: actions/download-artifact@v4
        with:
          pattern: bins-*
          path: bins/
          merge-multiple: true

      # Publish crates in topological order. `--allow-dirty` guards against any
      # stray working-tree state in CI; the tag checkout is clean in practice.
      # `--no-verify` is NOT used — each crate is built from the published tarball.
      - name: Publish to crates.io (topological order)
        run: |
          set -e
          for crate in \
              vampiro-cir \
              vampiro-law \
              vampiro-frontend-harness \
              vampiro-rust-frontend \
              vampiro-seam-analysis \
              vampiro-python-frontend \
              vampiro-clojure-frontend \
              vampiro-julia-frontend \
              vampiro-lifecycle-analysis \
              vampiro; do
            echo "::group::Publishing ${crate}"
            cargo publish --allow-dirty -p "${crate}"
            echo "::endgroup::"
            # Give the crates.io index a moment to propagate before the next
            # crate resolves its dependency on the just-published version.
            sleep 5
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Package archives and checksums
        id: pkg
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          mkdir -p dist

          for plat in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            tar -czf "dist/vampiro_${VERSION}_${plat}.tar.gz" \
              -C "bins/${plat}" vampiro
          done

          (cd bins/windows_amd64 && \
           zip "../../dist/vampiro_${VERSION}_windows_amd64.zip" vampiro.exe)

          cd dist && sha256sum *.tar.gz *.zip > checksums.txt

      - name: Create GitHub release
        run: |
          TAG="${GITHUB_REF_NAME}"
          PRERELEASE=""
          [[ "${TAG}" == *-* ]] && PRERELEASE="--prerelease"
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            $PRERELEASE \
            dist/*.tar.gz \
            dist/*.zip \
            dist/checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
