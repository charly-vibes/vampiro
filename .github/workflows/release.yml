# Release workflow — build cross-platform binaries and publish to crates.io + GitHub Releases
#
# Triggered by pushing a version tag (e.g., `git tag v0.3.0 && git push --tags`).
# - Builds the `vampiro` CLI for Linux, macOS, and Windows.
# - Publishes all workspace crates to crates.io in topological dependency order.
# - Creates a GitHub Release with pre-built binaries and checksums.
#
# Required secrets:
#   GITHUB_TOKEN           - automatically provided by GitHub Actions
#   CARGO_REGISTRY_TOKEN   - crates.io API token for publishing the crates
#
# Publish order (topological — each crate's path deps must land on crates.io first):
#   vampiro-cir → vampiro-law → vampiro-frontend-harness → vampiro-rust-frontend →
#   vampiro-seam-analysis → vampiro-python-frontend → vampiro-clojure-frontend →
#   vampiro-julia-frontend → vampiro-lifecycle-analysis → vampiro (the CLI)

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux

      - name: Install aarch64 cross-compile toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build x86_64 Linux
        run: cargo build --release --target x86_64-unknown-linux-gnu -p vampiro

      - name: Build aarch64 Linux
        run: cargo build --release --target aarch64-unknown-linux-gnu -p vampiro
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Stage binaries
        run: |
          mkdir -p bins/linux_amd64 bins/linux_arm64
          cp "target/x86_64-unknown-linux-gnu/release/vampiro" "bins/linux_amd64/vampiro"
          cp "target/aarch64-unknown-linux-gnu/release/vampiro" "bins/linux_arm64/vampiro"

      - uses: actions/upload-artifact@v7
        with:
          name: bins-linux
          path: bins/
          retention-days: 1

  build-darwin:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: darwin

      - name: Build x86_64 macOS
        run: cargo build --release --target x86_64-apple-darwin -p vampiro

      - name: Build aarch64 macOS
        run: cargo build --release --target aarch64-apple-darwin -p vampiro

      - name: Stage binaries
        run: |
          mkdir -p bins/darwin_amd64 bins/darwin_arm64
          cp "target/x86_64-apple-darwin/release/vampiro" "bins/darwin_amd64/vampiro"
          cp "target/aarch64-apple-darwin/release/vampiro" "bins/darwin_arm64/vampiro"

      - uses: actions/upload-artifact@v7
        with:
          name: bins-darwin
          path: bins/
          retention-days: 1

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: Build x86_64 Windows
        run: cargo build --release --target x86_64-pc-windows-msvc -p vampiro

      - name: Stage binaries
        shell: bash
        run: |
          mkdir -p bins/windows_amd64
          cp "target/x86_64-pc-windows-msvc/release/vampiro.exe" "bins/windows_amd64/vampiro.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: bins-windows
          path: bins/
          retention-days: 1

  publish:
    name: Publish to crates.io + GitHub Release
    needs: [build-linux, build-darwin, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: publish

      - uses: actions/download-artifact@v8
        with:
          pattern: bins-*
          path: bins/
          merge-multiple: true

      # Publish crates in topological order. `--allow-dirty` guards against any
      # stray working-tree state in CI; the tag checkout is clean in practice.
      # `--no-verify` is NOT used — each crate is built from the published tarball.
      #
      # Idempotent: a crate already on crates.io (e.g. from a partially-successful
      # prior run) is detected and skipped rather than aborting the sequence.
      #
      # Self-healing against crates.io new-crate rate limits (429): crates.io uses
      # a token bucket (~5 new crates burst, then ~1 per 10 min). On 429 the
      # response includes "Please try again after <RFC date>"; we parse it, sleep
      # until that time plus a buffer, and retry the same crate (up to 6 attempts).
      - name: Publish to crates.io (topological order)
        run: |
          set -uo pipefail

          max_attempts=6
          publish_one() {
            local crate="$1" attempt=0
            while :; do
              attempt=$((attempt + 1))
              local log
              log="$(mktemp)"
              if cargo publish --allow-dirty -p "${crate}" 2>&1 | tee "${log}"; then
                echo "  published ${crate}"
                rm -f "${log}"
                return 0
              elif grep -qiE "already exists|already uploaded|already been published" "${log}"; then
                echo "  ${crate} already on crates.io — skipping"
                rm -f "${log}"
                return 0
              elif grep -qi "429" "${log}"; then
                # Parse "Please try again after <RFC2822-ish date> GMT" and wait.
                local wait_until
                wait_until="$(grep -oE 'try again after [^<]+GMT' "${log}" | sed -E 's/try again after //')"
                rm -f "${log}"
                if [ -n "${wait_until}" ] && [ ${attempt} -lt ${max_attempts} ]; then
                  local target now sleep_secs
                  target="$(date -u -d "${wait_until}" +%s 2>/dev/null || echo 0)"
                  now="$(date -u +%s)"
                  sleep_secs=$(( target - now + 30 ))
                  if [ ${sleep_secs} -lt 5 ]; then sleep_secs=30; fi
                  echo "  ${crate}: rate-limited (429). Waiting ${sleep_secs}s for ${wait_until} then retrying (attempt ${attempt}/${max_attempts})..."
                  sleep ${sleep_secs}
                  continue
                fi
                echo "  !! ${crate}: rate-limited and out of retries"
                return 1
              else
                echo "  !! failed to publish ${crate}"
                cat "${log}"
                rm -f "${log}"
                return 1
              fi
            done
          }

          for crate in \
              vampiro-cir \
              vampiro-law \
              vampiro-frontend-harness \
              vampiro-rust-frontend \
              vampiro-seam-analysis \
              vampiro-python-frontend \
              vampiro-clojure-frontend \
              vampiro-julia-frontend \
              vampiro-lifecycle-analysis \
              vampiro; do
            echo "::group::Publishing ${crate}"
            publish_one "${crate}" || exit 1
            echo "::endgroup::"
            # Give the crates.io index a moment to propagate before the next
            # crate resolves its dependency on the just-published version.
            sleep 5
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Package archives and checksums
        id: pkg
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          mkdir -p dist

          for plat in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            tar -czf "dist/vampiro_${VERSION}_${plat}.tar.gz" \
              -C "bins/${plat}" vampiro
          done

          (cd bins/windows_amd64 && \
           zip "../../dist/vampiro_${VERSION}_windows_amd64.zip" vampiro.exe)

          cd dist && sha256sum *.tar.gz *.zip > checksums.txt

      - name: Create GitHub release
        run: |
          TAG="${GITHUB_REF_NAME}"
          PRERELEASE=""
          [[ "${TAG}" == *-* ]] && PRERELEASE="--prerelease"
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            $PRERELEASE \
            dist/*.tar.gz \
            dist/*.zip \
            dist/checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
