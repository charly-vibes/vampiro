---
name: Documentation Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "openspec/**"
      - "scripts/build_docs.py"
      - "book.toml"
      - "vampiro-ears-spec.md"
      - 'Cargo.toml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "openspec/**"
      - "scripts/build_docs.py"
      - "book.toml"
      - "vampiro-ears-spec.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install mdBook
        run: cargo install mdbook --version 0.5.2

      - name: Assemble authoritative documentation
        run: python scripts/build_docs.py

      - name: Generate release-status page from Cargo.toml
        # §6 (DDL-j0u): the book's version claims must come from Cargo.toml,
        # never from hand-typed text — hand-typed versions drift (ddl's
        # deployed book said v0.5.0 while the repo was v0.7.0).
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          TAG="${GITHUB_REF_NAME:-main}"
          mkdir -p docs/src
          cat > docs/src/release.md <<EOF
          # Release Status

          > **Generated artifact** (docs.yml, from Cargo.toml + git ref).
          > Do not hand-edit — the repo source files remain authoritative.

          - **Version:** v${VERSION}
          - **Built from:** ${TAG} @ ${GITHUB_SHA::7}
          EOF

      - name: Build documentation
        run: mdbook build

      - name: Copy LLM summaries to site root
        run: cp llms.txt llm.txt docs/book/

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v5
