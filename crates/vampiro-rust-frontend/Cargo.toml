[package]
name = "vampiro-rust-frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Rust language frontend for Vampiro — extracts CIR graphs from Rust source using syn"

[dependencies]
vampiro-cir = { path = "../vampiro-cir", version = "0.6.0" }
syn = { version = "3", features = ["full", "visit", "extra-traits", "clone-impls"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
# Path-only (no explicit version): seam-analysis dev-depends on this crate
# in turn, so version pins on both sides would create a publish deadlock —
# `cargo publish` resolves versioned dev-deps against the registry.
vampiro-seam-analysis = { path = "../vampiro-seam-analysis" }
