[package]
name = "vampiro-rust-frontend"
version = "0.1.0"
edition = "2021"
description = "Rust language frontend for Vampiro — extracts CIR graphs from Rust source using syn"

[dependencies]
vampiro-cir = { path = "../vampiro-cir" }
syn = { version = "2", features = ["full", "visit", "extra-traits", "clone-impls"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"