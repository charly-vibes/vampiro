[package]
name = "vampiro-seam-analysis"
version = "0.1.0"
edition = "2021"
description = "Language-neutral seam analysis for Vampiro — composition, modularity, optionality, and robustness checks over CIR"

[dependencies]
vampiro-cir = { path = "../vampiro-cir" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
vampiro-rust-frontend = { path = "../vampiro-rust-frontend" }
