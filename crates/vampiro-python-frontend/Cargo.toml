[package]
name = "vampiro-python-frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Python language frontend for Vampiro — extracts CIR graphs from Python source using tree-sitter"

[dependencies]
vampiro-cir = { path = "../vampiro-cir", version = "0.3.1" }
tree-sitter = "0.25"
tree-sitter-python = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
vampiro-frontend-harness = { path = "../vampiro-frontend-harness", version = "0.3.1" }
tempfile = "3"