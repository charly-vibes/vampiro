[package]
name = "vampiro-python-frontend"
version = "0.1.0"
edition = "2021"
description = "Python language frontend for Vampiro — extracts CIR graphs from Python source using tree-sitter"

[dependencies]
vampiro-cir = { path = "../vampiro-cir" }
tree-sitter = "0.25"
tree-sitter-python = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
vampiro-frontend-harness = { path = "../vampiro-frontend-harness" }
tempfile = "3"