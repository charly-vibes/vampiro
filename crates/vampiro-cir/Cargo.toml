[package]
name = "vampiro-cir"
version = "0.1.0"
edition = "2021"
description = "Composition IR types for Vampiro — the single boundary between syntax plugins and analysis"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }