[package]
name = "vampiro-clojure-frontend"
version = "0.2.0"
edition = "2021"
description = "Clojure language frontend for Vampiro — extracts CIR graphs from Clojure source using tree-sitter"

[dependencies]
vampiro-cir = { path = "../vampiro-cir" }
tree-sitter = "0.25"
tree-sitter-clojure = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
vampiro-frontend-harness = { path = "../vampiro-frontend-harness" }
tempfile = "3"