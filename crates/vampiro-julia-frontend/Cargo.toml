[package]
name = "vampiro-julia-frontend"
version = "0.3.0"
edition = "2021"
description = "Julia language frontend for Vampiro — extracts CIR graphs from Julia source using tree-sitter"

[dependencies]
vampiro-cir = { path = "../vampiro-cir" }
tree-sitter = "0.25"
tree-sitter-julia = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
vampiro-frontend-harness = { path = "../vampiro-frontend-harness" }
tempfile = "3"