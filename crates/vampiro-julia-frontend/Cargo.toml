[package]
name = "vampiro-julia-frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Julia language frontend for Vampiro — extracts CIR graphs from Julia source using tree-sitter"

[dependencies]
vampiro-cir = { path = "../vampiro-cir", version = "0.3.0" }
tree-sitter = "0.25"
tree-sitter-julia = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
vampiro-frontend-harness = { path = "../vampiro-frontend-harness", version = "0.3.0" }
tempfile = "3"