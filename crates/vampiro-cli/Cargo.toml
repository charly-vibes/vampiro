[package]
name = "vampiro"
version = "0.1.0"
edition = "2021"
description = "A program analysis tool for verifying compliance with laws and policies"

[[bin]]
name = "vampiro"
path = "src/main.rs"

[lib]
name = "vampiro_cli"
path = "src/lib.rs"

[dependencies]
genesis = { git = "ssh://git@cv/charly-vibes/genesis.git", tag = "v0.1.0" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.3"

[dev-dependencies]
tempfile = "3.27.0"
trycmd = "0.15"
vampiro-cir = { path = "../vampiro-cir" }
