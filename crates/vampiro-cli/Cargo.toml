[package]
name = "vampiro"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "A program analysis tool for verifying compliance with laws and policies"

[[bin]]
name = "vampiro"
path = "src/main.rs"

[lib]
name = "vampiro_cli"
path = "src/lib.rs"

[dependencies]
genesis-vibes = "0.4"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
hex = "0.4"
toml = "1.1.3"
git2 = "0.20"
vampiro-cir = { path = "../vampiro-cir", version = "0.3.1" }
vampiro-seam-analysis = { path = "../vampiro-seam-analysis", version = "0.3.1" }
vampiro-rust-frontend = { path = "../vampiro-rust-frontend", version = "0.3.1" }

[dev-dependencies]
tempfile = "3.27.0"
trycmd = "0.15"
vampiro-cir = { path = "../vampiro-cir", version = "0.3.1" }
vampiro-python-frontend = { path = "../vampiro-python-frontend", version = "0.3.1" }
vampiro-clojure-frontend = { path = "../vampiro-clojure-frontend", version = "0.3.1" }
vampiro-julia-frontend = { path = "../vampiro-julia-frontend", version = "0.3.1" }
