[package]
name = "vampiro"
version = "0.1.0"
edition = "2021"
description = "A program analysis tool for verifying compliance with laws and policies"

[[bin]]
name = "vampiro"
path = "src/main.rs"

[lib]
name = "vampiro_cli"
path = "src/lib.rs"

[dependencies]
genesis-vibes = "0.2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
hex = "0.4"
toml = "1.1.3"
git2 = "0.20"
vampiro-cir = { path = "../vampiro-cir" }
vampiro-seam-analysis = { path = "../vampiro-seam-analysis" }
vampiro-rust-frontend = { path = "../vampiro-rust-frontend" }

[dev-dependencies]
tempfile = "3.27.0"
trycmd = "0.15"
vampiro-cir = { path = "../vampiro-cir" }
vampiro-python-frontend = { path = "../vampiro-python-frontend" }
vampiro-clojure-frontend = { path = "../vampiro-clojure-frontend" }
vampiro-julia-frontend = { path = "../vampiro-julia-frontend" }
